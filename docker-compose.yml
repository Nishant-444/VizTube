services:
  gateway:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: viztube-gateway
    ports:
      - '3000:3000'
    env_file:
      - apps/api/.env
    depends_on:
      - ai-worker
    restart: unless-stopped

  ai-worker:
    build:
      context: apps/ai-worker
      dockerfile: Dockerfile
    container_name: viztube-ai-worker
    ports:
      - '8000:8000'
    env_file:
      - apps/ai-worker/.env
    restart: unless-stopped
